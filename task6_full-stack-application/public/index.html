<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>User Management System</h1>
        <p>Manage user information in one place</p>
    </header>

    <main class="container">
        <section class="card">
            <h2 id="form-title">Add New User</h2>

            <form id="user-form">
                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter full name"
                    required
                >

                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter email address"
                    required
                >

                <label for="age">Age</label>
                <input
                    type="number"
                    id="age"
                    placeholder="Enter age"
                    min="0"
                    step="1"
                    required
                >

                <div class="form-buttons">
                    <button type="submit" id="submit-button">Add User</button>
                    <button
                        type="button"
                        id="cancel-button"
                        class="secondary"
                        hidden
                    >
                        Cancel Edit
                    </button>
                </div>
            </form>

            <p id="message" role="status" aria-live="polite"></p>
        </section>

        <section class="card">
            <div class="list-header">
                <h2>Registered Users</h2>
                <button type="button" id="refresh-button" class="secondary">
                    Refresh
                </button>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Age</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="users-table">
                        <tr>
                            <td colspan="5">Loading users...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>Task 6 - Full Stack Application</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
